<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Pong</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-wrap">
    <div class="scoreboard">
      <div class="score player-score">Player: <span id="playerScore">0</span></div>
      <div class="score ai-score">Computer: <span id="aiScore">0</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="controls">Controls: Mouse to move paddle. Arrow Up / Arrow Down also work.</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
